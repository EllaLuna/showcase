title: Tiny Purple Cat
description: Indie games about heartfelt stories, cozy chaos and cats.
url: https://ellaluna.github.io
baseurl: ""
lang: en

# Site-wide links
discord_url: https://discord.gg/2tQvcFPaSf
instagram_url: https://www.instagram.com/tinypurplecatstudio/

# "Who we are" blurb on the homepage (spec section 8; use exactly)
studio_blurb: "Tiny Purple Cat is a small indie studio that grows a little with every game. A Mind Apart is made together with artist Alexander Epelman and musician Naor Hazan, and IncreCat Café is co-created with a fellow designer and artist. Our games range from heartfelt stories to cozy chaos, and there's usually a cat involved."

# Default social image (1200x630). Game pages can override with `image` in front matter.
image: /assets/img/brand/og-home.png

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# docs/ is planning only; keep it and repo files out of the built site.
exclude:
  - docs
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
